name: jk_ocr_camera
description: Scan Vietnamese ID documents (CCCD, CMND, passport, driver's license) and run OCR fully offline. Realtime capture guidance, QR reading, Android and iOS.
version: 1.0.0
homepage: https://github.com/MrTuyennn/jk_ocr_camera
repository: https://github.com/MrTuyennn/jk_ocr_camera/tree/main/jk_ocr_camera
issue_tracker: https://github.com/MrTuyennn/jk_ocr_camera/issues
topics: [ocr, camera, id-card, ekyc, scanner]
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  jk_ocr_camera_platform_interface: ^1.0.0
  jk_ocr_camera_android: ^1.0.0
  jk_ocr_camera_ios: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: jk_ocr_camera_android
      ios:
        default_package: jk_ocr_camera_ios
