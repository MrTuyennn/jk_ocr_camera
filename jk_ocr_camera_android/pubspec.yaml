name: jk_ocr_camera_android
description: Android implementation of the jk_ocr_camera plugin. Offline ID card scanning with CameraX and bundled ML Kit text and QR recognition.
version: 1.0.0
homepage: https://github.com/MrTuyennn/jk_ocr_camera
repository: https://github.com/MrTuyennn/jk_ocr_camera/tree/main/jk_ocr_camera_android
issue_tracker: https://github.com/MrTuyennn/jk_ocr_camera/issues
topics: [ocr, camera, id-card, ekyc]
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  jk_ocr_camera_platform_interface: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: jk_ocr_camera
    platforms:
      android:
        package: com.jk.ocr.flutter
        pluginClass: JkOcrCameraPlugin
        dartPluginClass: JkOcrCameraAndroid
